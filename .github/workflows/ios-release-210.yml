name: Lumi iOS 2.0.10 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-release-210.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: lumi-ios-release-210
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require successful WKWebView tests for the reviewed source
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = 44951892113;
            const expected = '67d5e8dfaa4092edacf5105f94edc681c878540d';
            for (let attempt = 0; attempt < 80; attempt++) {
              const {data: run} = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id});
              if (run.head_sha !== expected || run.head_repository.id !== 1427606855) throw new Error('Unexpected test source');
              const {data: {jobs}} = await github.rest.actions.listJobsForWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id});
              const simulator = jobs.find(job => job.name === 'simulator');
              const required = ['Build unsigned simulator app', 'Boot and launch on simulator'];
              if (simulator && required.every(name => simulator.steps.some(step => step.name === name && step.status === 'completed' && step.conclusion === 'success'))) {
                core.info('Exact-source native compile, storage/resume, artwork and touch acceptance checks passed. Diagnostics archival may finish separately.');
                return;
              }
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('WKWebView tests must pass before release');
                core.info('Final native UI, safe-area, storage and touch acceptance checks passed.');
                return;
              }
              core.info('Waiting for the existing simulator test.');
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            throw new Error('Simulator test is still running; release was not started');
  release:
    needs: quality
    uses: ./.github/workflows/ios-testflight.yml
    with:
      build_number: '8'
      upload: true
    secrets: inherit
