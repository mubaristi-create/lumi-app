name: iOS TestFlight archive
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unique positive iOS build number'
        required: true
        type: string
      upload:
        description: 'Upload signed test-ad build to TestFlight'
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify-api:
    runs-on: ubuntu-latest
    environment: ios-release
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: inputs.upload
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v4
        if: inputs.upload
        with:
          node-version: '22'
      - name: Verify Apple API authentication and app access
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: node .github/scripts/check-asc-api.mjs
  archive:
    needs: verify-api
    runs-on: macos-15-intel
    environment: ios-release
    timeout-minutes: 45
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
      IOS_AD_MODE: test
      IOS_APPLE_SIGN_IN: ${{ vars.IOS_APPLE_SIGN_IN || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6da961075581682f0f64f39358c343092a32e959
          persist-credentials: false
      - name: Check out trusted release tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check API secret formats before building
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash release-tools/.github/scripts/upload-testflight-api.sh --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Install locked dependencies
        working-directory: mobile
        run: npm ci
      - name: Import signing into temporary keychain
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CERT:?Apple Developer signing certificate not configured}"
          : "${PROFILE:?App Store distribution profile not configured}"
          cert_path="$RUNNER_TEMP/ios.p12"
          profile_path="$RUNNER_TEMP/ios.mobileprovision"
          keychain_path="$RUNNER_TEMP/lumi-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERT" | base64 --decode > "$cert_path"
          printf '%s' "$PROFILE" | base64 --decode > "$profile_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path" > /dev/null
          security list-keychain -d user -s "$keychain_path"
          security cms -D -i "$profile_path" > "$RUNNER_TEMP/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
      - name: Archive and export signed IPA
        working-directory: mobile
        run: bash scripts/build-ios-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lumi-iOS-TestFlight-${{ inputs.build_number }}
          path: mobile/build/artifacts/
          retention-days: 14
      - name: Validate and upload to TestFlight with API key
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash release-tools/.github/scripts/upload-testflight-api.sh mobile/build/artifacts/App.ipa
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/lumi-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/ios.p12" "$RUNNER_TEMP/ios.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision
