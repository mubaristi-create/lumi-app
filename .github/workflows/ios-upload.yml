name: Upload verified Lumi iOS build
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  upload:
    runs-on: macos-26
    environment: ios-release
    timeout-minutes: 25
    steps:
      - name: Check out trusted release tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Check API secret formats
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash release-tools/.github/scripts/upload-testflight-api.sh --check
      - uses: actions/download-artifact@v4
        with:
          name: Lumi-iOS-TestFlight-1
          path: signed-build
          github-token: ${{ github.token }}
          run-id: 44135967371
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Check signed application identity
        shell: bash
        run: |
          set -euo pipefail
          test -f signed-build/App.ipa
          unzip -q signed-build/App.ipa -d verify-app
          app="verify-app/Payload/App.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = az.playlumio.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = 2.0.8
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = 1
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app" > entitlements.plist 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' entitlements.plist)" = 248HG7USHB
          shasum -a 256 signed-build/App.ipa
      - name: Validate and upload to App Store Connect with API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash release-tools/.github/scripts/upload-testflight-api.sh signed-build/App.ipa
